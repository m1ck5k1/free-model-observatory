# Provider registry for Free Model Observatory v0.1
# Each provider has a catalogue endpoint, auth strategy, and known free models.
# The floor model (Ollama) is always present and not counted against the cap.

version: 1
updated_at: "2026-07-30T00:00:00Z"

providers:
  openrouter:
    display_name: OpenRouter
    catalogue_url: "https://openrouter.ai/api/v1/models"
    catalogue_type: openai_compatible
    auth_type: header
    auth_header: "Authorization"
    auth_prefix: "Bearer "
    filter: ":free"  # suffix filter on model IDs
    free_model_identifiers: null  # dynamic; filter on :free suffix
    api_base: "https://openrouter.ai/api/v1"
    source_confidence: high
    retention_policy: unknown
    retention_verified: null
    verified_by: null
    evidence_url: null
    evidence_quote_hash: null
    notes: "Retention is per-endpoint and per-account-settings, not provider-level. Requires manual review of account privacy settings and downstream provider terms."

  google:
    display_name: Google AI Studio / Gemini
    catalogue_url: "https://generativelanguage.googleapis.com/v1/models"
    catalogue_type: google
    auth_type: query_param
    auth_param: "key"
    auth_env_var: "GOOGLE_API_KEY"
    free_model_identifiers:
      - "gemini-2.0-flash"
      - "gemini-2.0-flash-lite"
      - "gemini-1.5-flash"
      - "gemini-1.5-flash-8b"
    api_base: "https://generativelanguage.googleapis.com/v1"
    source_confidence: high
    retention_policy: unknown
    retention_verified: null
    verified_by: null
    evidence_url: null
    evidence_quote_hash: null
    notes: "Free Gemini tier trains on input per Google's terms. Paid tier may differ. Required before marking no_train: read the actual terms, capture the clause."

  groq:
    display_name: Groq
    catalogue_url: "https://api.groq.com/openai/v1/models"
